<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Parsing Activity</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef3f7;
            border-radius: 6px;
        }

        #status {
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>JSON Parsing Activity</h1>

        <p>
            Click the button to retrieve a post from a REST API and display selected JSON fields.
        </p>

        <button id="loadButton">Load Post</button>

        <p id="status" role="status">Waiting for request...</p>

        <div id="result">
            <p>The post will appear here.</p>
        </div>
    </div>

    <script>
        const loadButton = document.getElementById("loadButton");
        const statusElement = document.getElementById("status");
        const resultElement = document.getElementById("result");

        loadButton.addEventListener("click", async function () {
            statusElement.textContent = "Loading data...";
            resultElement.replaceChildren();

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts/1"
                );

                if (!response.ok) {
                    throw new Error(
                        "HTTP error: " + response.status
                    );
                }

                const post = await response.json();

                const title = document.createElement("h2");
                title.textContent = post.title;

                const postId = document.createElement("p");
                postId.textContent = "Post ID: " + post.id;

                const userId = document.createElement("p");
                userId.textContent = "User ID: " + post.userId;

                const body = document.createElement("p");
                body.textContent = post.body;

                resultElement.append(
                    title,
                    postId,
                    userId,
                    body
                );

                statusElement.textContent = "Data retrieved successfully.";

            } catch (error) {
                statusElement.textContent =
                    "Unable to retrieve data. Check your connection and try again.";

                const message = document.createElement("p");
                message.textContent = error.message;

                resultElement.appendChild(message);
            }
        });
    </script>
</body>

</html>
